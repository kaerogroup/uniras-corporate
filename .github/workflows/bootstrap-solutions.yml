name: Bootstrap Solutions source from live Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.ref == 'refs/heads/solutions-production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solutions-production
          persist-credentials: true

      - name: Import CURRENT published website as source baseline
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://uniras-solution.pages.dev"
          DEST="solutions/site"
          mkdir -p "$DEST/assets"
          for file in index.html robots.txt sitemap.xml; do
            curl --fail --location --show-error --retry 3 --max-time 40 "$SITE/$file" -o "$DEST/$file"
          done
          for file in 1000922334.jpg 1000922315.jpg 1000922443.jpg 1000922459.jpg 1000922360.jpg 1000922313.jpg 1000922451.jpg; do
            curl --fail --location --show-error --retry 3 --max-time 40 "$SITE/assets/$file" -o "$DEST/assets/$file"
          done
          test -s "$DEST/index.html"
          test "$(find "$DEST/assets" -name '*.jpg' | wc -l)" -eq 7
          grep -qi '<html' "$DEST/index.html"
          if grep -Eiq '(error 404|page not found)' "$DEST/index.html"; then
            echo "ERROR: Unexpected 404 / error page fetched" >&2
            exit 1
          fi

      - name: Commit imported files to isolated Solutions branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solutions/site
          if git diff --cached --quiet; then
            echo "Source already matches published website"
            exit 0
          fi
          git commit -m "chore(solutions): import live Cloudflare Pages website as source"
          git push origin HEAD:solutions-production
